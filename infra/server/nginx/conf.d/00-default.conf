# Default catch-all: reject requests to unknown hostnames / raw IP.
server {
    listen 80 default_server;
    server_name _;

    # ACME challenge must always work, even on the default vhost
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;
    }
}
