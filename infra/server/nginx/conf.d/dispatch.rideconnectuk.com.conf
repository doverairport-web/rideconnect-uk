# Dispatch app: dispatch.rideconnectuk.com
server {
    listen 80;
    server_name dispatch.rideconnectuk.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Grafana is reachable behind the dispatch domain (basic path routing).
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files /maintenance.html =503;
        # When the dispatch app is deployed (container "dispatch" on the
        # rideconnect network), replace the two lines above with:
        # proxy_pass http://dispatch:3000;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }
}
